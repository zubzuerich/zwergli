<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inserat – Zwergli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .detail-section { padding: 40px 0 80px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
    .detail-photo {
      aspect-ratio: 4/3; background: var(--moss-bg); border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center; color: var(--forest);
    }
    .detail-photo svg { width: 60px; height: 60px; opacity: 0.35; }
    .detail-preis { font-family: var(--font-display); font-size: 2rem; color: var(--forest); margin: 10px 0 20px; }
    .detail-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .detail-tag { background: var(--moss-bg-soft); border-radius: 999px; padding: 6px 14px; font-size: 0.85rem; color: var(--forest-deep); }
    .detail-beschreibung { color: #4C5A4F; line-height: 1.7; margin-bottom: 28px; }
    .detail-back { display: inline-block; margin-bottom: 20px; font-size: 0.9rem; color: var(--forest); font-weight: 700; }
    @media (max-width: 760px) { .detail-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">Zwergli<span class="logo-dot">.</span></a>

      <nav class="main-nav" id="main-nav">
        <a href="marktplatz.html">Marktplatz</a>
        <a href="groessen-guide.html">Grössen-Guide</a>
        <a href="wie-es-funktioniert.html">Wie es funktioniert</a>
        <a href="ueber-uns.html">Über uns</a>
      </nav>

      <div class="header-actions">
        <button class="btn btn-ghost" id="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">☰</button>
        <a href="inserat-erstellen.html" class="btn btn-primary">Jetzt verkaufen</a>
      </div>
    </div>
  </header>

  <!-- ===== DETAIL ===== -->
  <section class="detail-section">
    <div class="wrap" id="inserat-detail">
      <a href="marktplatz.html" class="detail-back">← Zurück zum Marktplatz</a>

      <div class="detail-grid">
        <div class="detail-photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
        </div>
        <div>
          <h1 id="detail-titel" style="font-size: clamp(1.6rem, 3vw, 2.1rem);">–</h1>
          <div class="detail-preis" id="detail-preis">–</div>
          <div class="detail-tags">
            <span class="detail-tag" id="detail-zustand">–</span>
            <span class="detail-tag">Grösse <span id="detail-groesse">–</span></span>
            <span class="detail-tag" id="detail-region">–</span>
            <span class="detail-tag" id="detail-kategorie">–</span>
          </div>
          <p class="detail-beschreibung" id="detail-beschreibung">–</p>
          <a href="#" class="btn btn-primary btn-lg" onclick="alert('Demo-Prototyp: Hier würde sich der Zwergli-Chat mit der verkaufenden Person öffnen.'); return false;">Nachricht senden</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© 2026 Zwergli · Ein Transferarbeit-Projekt</span>
      <span>Made in Winterthur, Schweiz</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
